# Worked example: Let's Encrypt + ZeroSSL + Entrust, all via Route53
# DNS-01, plus a pre-approved-domains allowlist and a manual-review
# fallback bound to an SSO group. Every REPLACE_ME_* value is a
# placeholder -- copy this file, fill in your real values, and pass it
# with `helm install -f`.
#
# The real secret material (account keys, EAB HMAC key, Route53 secret
# access key) never goes in this file -- it stays in Kubernetes Secrets
# referenced by name/key below. On EKS, skip static AWS keys entirely and
# use IRSA instead: drop accessKeyID/secretAccessKeySecretRef and set
# `role: <arn>` on cert-manager's ServiceAccount.
# https://cert-manager.io/docs/configuration/acme/dns01/route53/

issuers:
  - name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    email: certs@example.com
    dnsZones: ["example.com"]
    dns01:
      route53:
        region: us-east-1
        hostedZoneID: REPLACE_ME_HOSTED_ZONE_ID
        accessKeyID: REPLACE_ME_AWS_ACCESS_KEY_ID
        secretAccessKeySecretRef:
          name: route53-credentials
          key: secret-access-key

  - name: zerossl-prod
    server: https://acme.zerossl.com/v2/DV90
    email: certs@example.com
    externalAccountBinding:
      keyID: REPLACE_ME_ZEROSSL_EAB_KEY_ID
      keySecretName: zerossl-eab-key
      keySecretKey: secret
    dnsZones: ["example.com"]
    dns01:
      route53:
        region: us-east-1
        hostedZoneID: REPLACE_ME_HOSTED_ZONE_ID
        accessKeyID: REPLACE_ME_AWS_ACCESS_KEY_ID
        secretAccessKeySecretRef:
          name: route53-credentials
          key: secret-access-key

  - name: entrust-prod
    # Entrust's ACME directory URL is account/workflow-specific -- yours is
    # issued when you set up an ACME enrollment workflow in the Entrust
    # PKIaaS console (Certificate Services > ACME), not a fixed public URL
    # like the other two issuers above.
    # https://docs.pkiaas.entrust.com/acme/pkiaas/
    server: REPLACE_ME_ENTRUST_ACME_DIRECTORY_URL
    email: certs@example.com
    externalAccountBinding:
      keyID: REPLACE_ME_ENTRUST_EAB_KEY_ID
      keySecretName: entrust-eab-key
      keySecretKey: secret
    dnsZones: ["example.com"]
    dns01:
      route53:
        region: us-east-1
        hostedZoneID: REPLACE_ME_HOSTED_ZONE_ID
        accessKeyID: REPLACE_ME_AWS_ACCESS_KEY_ID
        secretAccessKeySecretRef:
          name: route53-credentials
          key: secret-access-key

policies:
  preApprovedDomains:
    dnsNames:
      - "*.example.com"
      - "example.com"
  manualReview:
    enabled: true
    reviewerGroup: REPLACE_ME_SSO_GROUP # map to your SSO/IdP group
