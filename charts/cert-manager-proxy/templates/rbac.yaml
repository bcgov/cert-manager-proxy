apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cert-manager-proxy.fullname" . }}
  namespace: {{ include "cert-manager-proxy.namespace" . }}
  labels:
    {{- include "cert-manager-proxy.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-proxy.fullname" . }}
  namespace: {{ include "cert-manager-proxy.namespace" . }}
  labels:
    {{- include "cert-manager-proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cert-manager-proxy.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-manager-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Grants the proxy's own ServiceAccount permission to satisfy the
# "pre-approved-domains" CertificateRequestPolicy (see manifests/ in this
# repo) via approver-policy's RBAC-gated approval -- but nothing more, so
# any request outside that policy's allowed domains stays unapproved
# instead of silently going through.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-proxy.fullname" . }}-approver
  labels:
    {{- include "cert-manager-proxy.labels" . | nindent 4 }}
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: ["pre-approved-domains"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-proxy.fullname" . }}-approver
  labels:
    {{- include "cert-manager-proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-proxy.fullname" . }}-approver
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-manager-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
