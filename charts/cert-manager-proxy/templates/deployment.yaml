{{- if not (or .Values.auth.existingSecretName .Values.auth.token) }}
{{- fail "Set auth.existingSecretName (recommended) or auth.token before installing." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cert-manager-proxy.fullname" . }}
  labels:
    {{- include "cert-manager-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cert-manager-proxy.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cert-manager-proxy.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "cert-manager-proxy.serviceAccountName" . }}
      containers:
        - name: cert-manager-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CERT_PROXY_NAMESPACE
              value: {{ include "cert-manager-proxy.namespace" . }}
            - name: CERT_PROXY_ADDR
              value: ":8080"
            - name: CERT_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cert-manager-proxy.authSecretName" . }}
                  key: {{ .Values.auth.existingSecretKey }}
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
