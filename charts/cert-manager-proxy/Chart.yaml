apiVersion: v2
name: cert-manager-proxy
description: Multi-provider ACME intake proxy for cert-manager with DNS-01 and out-of-band pre-approval
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/bcgov/cert-manager-proxy
sources:
  - https://github.com/bcgov/cert-manager-proxy
dependencies:
  - name: cert-manager
    version: "v1.21.1"
    repository: "oci://quay.io/jetstack/charts"
    condition: cert-manager.enabled
  - name: cert-manager-approver-policy
    version: "v0.27.0"
    repository: "oci://quay.io/jetstack/charts"
    condition: approverPolicyEnabled
