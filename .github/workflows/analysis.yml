name: Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 11 * * 0" # 3 AM PST Sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    name: Tests
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: true

  chart:
    name: Chart
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      HELMFILE_VERSION: "1.7.4"
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install Helmfile
        run: |
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" | tar xz helmfile
          sudo mv helmfile /usr/local/bin/helmfile
      - name: Lint (default values)
        run: helm lint charts/cert-manager-proxy --set auth.token=ci-placeholder
      - name: Lint (values-example.yaml)
        run: helm lint charts/cert-manager-proxy -f charts/cert-manager-proxy/values-example.yaml --set auth.token=ci-placeholder
      - name: Template (default values)
        run: helm template test charts/cert-manager-proxy --set auth.token=ci-placeholder > /dev/null
      - name: Template (values-example.yaml)
        run: helm template test charts/cert-manager-proxy -f charts/cert-manager-proxy/values-example.yaml --set auth.token=ci-placeholder > /dev/null
      - name: Validate helmfile.yaml (dependency graph + lint + render)
        run: |
          export CERT_PROXY_TOKEN=ci-placeholder
          helmfile show-dag
          helmfile lint
          helmfile template > /dev/null

  integration:
    name: Integration
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      HELMFILE_VERSION: "1.7.4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install Helmfile
        run: |
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" | tar xz helmfile
          sudo mv helmfile /usr/local/bin/helmfile
      - name: Run `helmfile sync` on a real ephemeral k3s cluster and verify it
        run: go test -tags integration -v -timeout 15m ./test/integration/...

  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: (! github.event.pull_request.draft)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # trivy-action caches .trivycache internally.

      # Reports every severity to the Security tab for triage. Findings are not a
      # merge gate: advisories are published on their own schedule, not the
      # contributor's, and committed secrets are already blocked at push time by
      # GitHub secret scanning.
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          cache-dir: .trivycache
          skip-dirs: "**/coverage,**/bin,.git"
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: Analysis Results
    needs: [tests, chart, integration, trivy]
    if: always() && (! github.event.pull_request.draft)
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Critical check failure: a required job failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "All critical checks passed or were intentionally skipped."
