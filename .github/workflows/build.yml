name: Build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/action-builder-ghcr
  # package == repo name → ghcr.io/bcgov/cert-manager-proxy (chart default).
  build:
    name: Build
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: cert-manager-proxy
          build_context: .
          build_file: Dockerfile
          tags: |
            ${{ github.event.pull_request.number || 'latest' }}
            ${{ github.event.pull_request.head.sha || github.sha }}
          tag_fallback: latest
          triggers: ('Dockerfile', 'cmd/', 'internal/', 'go.mod', 'go.sum', '.github/workflows/build.yml')

  results:
    name: Build Results
    if: always()
    needs: [build]
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Evaluate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Success!"
