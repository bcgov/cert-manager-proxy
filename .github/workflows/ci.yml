name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: true

  chart:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Build chart dependencies
        run: helm dependency build charts/cert-manager-proxy
      - name: Lint (default values)
        run: helm lint charts/cert-manager-proxy --set auth.token=ci-placeholder
      - name: Lint (values-example.yaml)
        run: helm lint charts/cert-manager-proxy -f charts/cert-manager-proxy/values-example.yaml --set auth.token=ci-placeholder
      - name: Template (default values)
        run: helm template test charts/cert-manager-proxy --set auth.token=ci-placeholder > /dev/null
      - name: Template (values-example.yaml)
        run: helm template test charts/cert-manager-proxy -f charts/cert-manager-proxy/values-example.yaml --set auth.token=ci-placeholder > /dev/null

  integration:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install the chart on a real ephemeral k3s cluster and verify it
        run: go test -tags integration -v -timeout 15m ./test/integration/...
