# One ClusterIssuer per ACME CA/provider. DNS-01 via Route53 shown; swap the
# `route53` block for cloudflare/azuredns/clouddns/webhook per provider.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: certs@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: REPLACE_ME_HOSTED_ZONE_ID
            # Static keys shown for clarity. On EKS, prefer IRSA instead —
            # drop accessKeyID/secretAccessKeySecretRef and set `role: <arn>`
            # on the ServiceAccount cert-manager runs as; no long-lived
            # credentials at all. https://cert-manager.io/docs/configuration/acme/dns01/route53/
            accessKeyID: REPLACE_ME_AWS_ACCESS_KEY_ID
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key
        selector:
          dnsZones:
            - "example.com"
---
# Second provider, same shape — this is what makes it multi-provider: pick
# the ClusterIssuer by name from the intake API, nothing else changes.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: zerossl-prod
spec:
  acme:
    server: https://acme.zerossl.com/v2/DV90
    email: certs@example.com
    externalAccountBinding:
      keyID: REPLACE_ME_ZEROSSL_EAB_KEY_ID
      keySecretRef:
        name: zerossl-eab-key
        key: secret
    privateKeySecretRef:
      name: zerossl-prod-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: REPLACE_ME_HOSTED_ZONE_ID
            # Static keys shown for clarity. On EKS, prefer IRSA instead —
            # drop accessKeyID/secretAccessKeySecretRef and set `role: <arn>`
            # on the ServiceAccount cert-manager runs as; no long-lived
            # credentials at all. https://cert-manager.io/docs/configuration/acme/dns01/route53/
            accessKeyID: REPLACE_ME_AWS_ACCESS_KEY_ID
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key
        selector:
          dnsZones:
            - "example.com"
