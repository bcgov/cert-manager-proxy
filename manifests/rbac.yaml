# The intake API's SA can only satisfy the pre-approved-domains policy — so
# anything outside the allowlist falls through unapproved automatically.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-proxy-intake-approver
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: ["pre-approved-domains"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-proxy-intake-approver-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-proxy-intake-approver
subjects:
  - kind: ServiceAccount
    name: cert-proxy-intake
    namespace: cert-proxy
---
# Human reviewers get the manual-review policy — this is the out-of-band
# approval surface: they approve pending CertificateRequests directly
# (`kubectl cert-manager approve <name>`) for anything not pre-allowlisted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manual-reviewer
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: ["manual-review"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manual-reviewer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manual-reviewer
subjects:
  - kind: Group
    name: cert-approvers   # map to your SSO/IdP group
    apiGroup: rbac.authorization.k8s.io
